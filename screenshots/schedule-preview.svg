<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" style="background:#0a0e17; font-family:'Inter', sans-serif;">
  <defs>
    <linearGradient id="indigoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>

  <!-- Title & Header -->
  <rect x="30" y="30" width="940" height="70" rx="12" fill="#111827" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <rect x="50" y="45" width="40" height="40" rx="10" fill="url(#indigoGrad)"/>
  <circle cx="70" cy="65" r="8" fill="none" stroke="#ffffff" stroke-width="2.5"/>
  <polyline points="70 61 70 65 74 65" fill="none" stroke="#ffffff" stroke-width="2.5"/>
  <text x="105" y="65" fill="#f9fafb" font-size="18" font-weight="700">CronPulse Pro — Execution Schedule &amp; Interval Timelines</text>
  <text x="105" y="85" fill="#9ca3af" font-size="12">Schedule: 0 0 * * * (Daily Midnight Financial Settlement) | Timezone: UTC</text>

  <!-- Schedule Table Container -->
  <rect x="30" y="120" width="940" height="440" rx="12" fill="#111827" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  
  <!-- Table Header -->
  <rect x="30" y="120" width="940" height="45" rx="12" fill="rgba(255,255,255,0.03)"/>
  <text x="60" y="148" fill="#9ca3af" font-size="11" font-weight="600">RUN #</text>
  <text x="160" y="148" fill="#9ca3af" font-size="11" font-weight="600">TARGET EXECUTION TIMESTAMP (UTC)</text>
  <text x="560" y="148" fill="#9ca3af" font-size="11" font-weight="600">INTERVAL DELTA</text>
  <text x="850" y="148" fill="#9ca3af" font-size="11" font-weight="600" text-anchor="middle">COUNTDOWN</text>

  <!-- Rows -->
  <g font-family="'JetBrains Mono', monospace" font-size="12">
    <!-- Row 1 -->
    <text x="60" y="195" fill="#38bdf8" font-weight="bold">#01</text>
    <text x="160" y="195" fill="#f3f4f6">2026-09-30 00:00:00 UTC</text>
    <text x="560" y="195" fill="#9ca3af">Starts +7h 41m</text>
    <rect x="800" y="180" width="100" height="24" rx="4" fill="rgba(16,185,129,0.15)" stroke="rgba(16,185,129,0.3)"/>
    <text x="850" y="196" fill="#34d399" font-size="11" font-weight="bold" text-anchor="middle">in 7h 41m</text>
    <line x1="45" y1="215" x2="955" y2="215" stroke="rgba(255,255,255,0.04)"/>

    <!-- Row 2 -->
    <text x="60" y="245" fill="#38bdf8" font-weight="bold">#02</text>
    <text x="160" y="245" fill="#f3f4f6">2026-10-01 00:00:00 UTC</text>
    <text x="560" y="245" fill="#9ca3af">+24h 00m</text>
    <rect x="800" y="230" width="100" height="24" rx="4" fill="rgba(16,185,129,0.15)" stroke="rgba(16,185,129,0.3)"/>
    <text x="850" y="246" fill="#34d399" font-size="11" font-weight="bold" text-anchor="middle">in 1d 7h</text>
    <line x1="45" y1="265" x2="955" y2="265" stroke="rgba(255,255,255,0.04)"/>

    <!-- Row 3 -->
    <text x="60" y="295" fill="#38bdf8" font-weight="bold">#03</text>
    <text x="160" y="295" fill="#f3f4f6">2026-10-02 00:00:00 UTC</text>
    <text x="560" y="295" fill="#9ca3af">+24h 00m</text>
    <rect x="800" y="280" width="100" height="24" rx="4" fill="rgba(16,185,129,0.15)" stroke="rgba(16,185,129,0.3)"/>
    <text x="850" y="296" fill="#34d399" font-size="11" font-weight="bold" text-anchor="middle">in 2d 7h</text>
    <line x1="45" y1="315" x2="955" y2="315" stroke="rgba(255,255,255,0.04)"/>

    <!-- Row 4 -->
    <text x="60" y="345" fill="#38bdf8" font-weight="bold">#04</text>
    <text x="160" y="345" fill="#f3f4f6">2026-10-03 00:00:00 UTC</text>
    <text x="560" y="345" fill="#9ca3af">+24h 00m</text>
    <rect x="800" y="330" width="100" height="24" rx="4" fill="rgba(16,185,129,0.15)" stroke="rgba(16,185,129,0.3)"/>
    <text x="850" y="346" fill="#34d399" font-size="11" font-weight="bold" text-anchor="middle">in 3d 7h</text>
    <line x1="45" y1="365" x2="955" y2="365" stroke="rgba(255,255,255,0.04)"/>

    <!-- Row 5 -->
    <text x="60" y="395" fill="#38bdf8" font-weight="bold">#05</text>
    <text x="160" y="395" fill="#f3f4f6">2026-10-04 00:00:00 UTC</text>
    <text x="560" y="395" fill="#9ca3af">+24h 00m</text>
    <rect x="800" y="380" width="100" height="24" rx="4" fill="rgba(16,185,129,0.15)" stroke="rgba(16,185,129,0.3)"/>
    <text x="850" y="396" fill="#34d399" font-size="11" font-weight="bold" text-anchor="middle">in 4d 7h</text>
    <line x1="45" y1="415" x2="955" y2="415" stroke="rgba(255,255,255,0.04)"/>

    <!-- Row 6 -->
    <text x="60" y="445" fill="#38bdf8" font-weight="bold">#06</text>
    <text x="160" y="445" fill="#f3f4f6">2026-10-05 00:00:00 UTC</text>
    <text x="560" y="445" fill="#9ca3af">+24h 00m</text>
    <rect x="800" y="430" width="100" height="24" rx="4" fill="rgba(16,185,129,0.15)" stroke="rgba(16,185,129,0.3)"/>
    <text x="850" y="446" fill="#34d399" font-size="11" font-weight="bold" text-anchor="middle">in 5d 7h</text>
    <line x1="45" y1="465" x2="955" y2="465" stroke="rgba(255,255,255,0.04)"/>

    <!-- Row 7 -->
    <text x="60" y="495" fill="#38bdf8" font-weight="bold">#07</text>
    <text x="160" y="495" fill="#f3f4f6">2026-10-06 00:00:00 UTC</text>
    <text x="560" y="495" fill="#9ca3af">+24h 00m</text>
    <rect x="800" y="480" width="100" height="24" rx="4" fill="rgba(16,185,129,0.15)" stroke="rgba(16,185,129,0.3)"/>
    <text x="850" y="496" fill="#34d399" font-size="11" font-weight="bold" text-anchor="middle">in 6d 7h</text>
  </g>
</svg>
