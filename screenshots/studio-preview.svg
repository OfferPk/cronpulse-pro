<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" style="background:#0a0e17; font-family:'Inter', sans-serif;">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>

  <!-- Top Navigation -->
  <rect x="20" y="20" width="1160" height="60" rx="12" fill="#111827" stroke="rgba(255,255,255,0.1)"/>
  <rect x="35" y="32" width="36" height="36" rx="8" fill="url(#brandGrad)"/>
  <circle cx="53" cy="50" r="8" fill="none" stroke="#fff" stroke-width="2.5"/>
  <polyline points="53 46 53 50 57 50" fill="none" stroke="#fff" stroke-width="2.5"/>
  <text x="85" y="48" fill="#fff" font-size="16" font-weight="bold">CronPulse Pro Studio</text>
  <text x="85" y="65" fill="#9ca3af" font-size="11">Architectural Cron AST Evaluator &amp; Distributed Lock Synthesizer</text>

  <!-- Preset Buttons -->
  <rect x="850" y="35" width="100" height="30" rx="6" fill="#6366f1"/>
  <text x="900" y="55" fill="#fff" font-size="11" font-weight="600" text-anchor="middle">Daily Settle</text>
  <rect x="960" y="35" width="105" height="30" rx="6" fill="rgba(255,255,255,0.08)"/>
  <text x="1012" y="55" fill="#9ca3af" font-size="11" font-weight="600" text-anchor="middle">15m Metering</text>
  <rect x="1075" y="35" width="90" height="30" rx="6" fill="rgba(255,255,255,0.08)"/>
  <text x="1120" y="55" fill="#9ca3af" font-size="11" font-weight="600" text-anchor="middle">30s Heartbeat</text>

  <!-- Natural Language Hero Banner -->
  <rect x="20" y="95" width="1160" height="55" rx="10" fill="rgba(99,102,241,0.15)" stroke="rgba(99,102,241,0.3)"/>
  <text x="40" y="128" fill="#f3f4f6" font-size="14" font-weight="600">"Every 15 minutes, Monday through Friday, 09:00 AM to 05:00 PM UTC."</text>
  <rect x="1030" y="108" width="135" height="28" rx="6" fill="rgba(0,0,0,0.4)" stroke="rgba(255,255,255,0.1)"/>
  <text x="1097" y="127" fill="#06b6d4" font-size="11" font-family="'JetBrains Mono', monospace" font-weight="bold" text-anchor="middle">UNIX 5-FIELD</text>

  <!-- Left Column: Cron Editor (Width 400) -->
  <rect x="20" y="165" width="400" height="505" rx="12" fill="#111827" stroke="rgba(255,255,255,0.1)"/>
  <text x="40" y="195" fill="#fff" font-size="14" font-weight="bold">Cron Expression Editor</text>

  <!-- Cron Input Box -->
  <rect x="40" y="215" width="360" height="60" rx="8" fill="rgba(0,0,0,0.5)" stroke="rgba(255,255,255,0.15)"/>
  <text x="55" y="254" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="bold">*/15 9-17 * * 1-5</text>

  <!-- 5 Field Pills -->
  <g transform="translate(40, 290)">
    <rect x="0" y="0" width="65" height="45" rx="6" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.1)"/>
    <text x="32" y="18" fill="#9ca3af" font-size="9" text-anchor="middle">MINUTE</text>
    <text x="32" y="36" fill="#fff" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" text-anchor="middle">*/15</text>

    <rect x="73" y="0" width="65" height="45" rx="6" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.1)"/>
    <text x="105" y="18" fill="#9ca3af" font-size="9" text-anchor="middle">HOUR</text>
    <text x="105" y="36" fill="#fff" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" text-anchor="middle">9-17</text>

    <rect x="146" y="0" width="65" height="45" rx="6" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.1)"/>
    <text x="178" y="18" fill="#9ca3af" font-size="9" text-anchor="middle">DOM</text>
    <text x="178" y="36" fill="#fff" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" text-anchor="middle">*</text>

    <rect x="219" y="0" width="65" height="45" rx="6" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.1)"/>
    <text x="251" y="18" fill="#9ca3af" font-size="9" text-anchor="middle">MONTH</text>
    <text x="251" y="36" fill="#fff" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" text-anchor="middle">*</text>

    <rect x="292" y="0" width="65" height="45" rx="6" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.1)"/>
    <text x="324" y="18" fill="#9ca3af" font-size="9" text-anchor="middle">DOW</text>
    <text x="324" y="36" fill="#fff" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" text-anchor="middle">1-5</text>
  </g>

  <!-- Quick Shorthands -->
  <text x="40" y="365" fill="#9ca3af" font-size="11">COMMON CADENCES</text>
  <g transform="translate(40, 380)" font-size="11">
    <rect x="0" y="0" width="105" height="30" rx="6" fill="rgba(255,255,255,0.05)"/>
    <text x="52" y="20" fill="#9ca3af" text-anchor="middle">Every Minute</text>
    <rect x="115" y="0" width="105" height="30" rx="6" fill="rgba(255,255,255,0.05)"/>
    <text x="167" y="20" fill="#9ca3af" text-anchor="middle">Hourly (00)</text>
    <rect x="230" y="0" width="130" height="30" rx="6" fill="rgba(255,255,255,0.05)"/>
    <text x="295" y="20" fill="#9ca3af" text-anchor="middle">Weekly (Mon)</text>
  </g>

  <!-- Right Column: Schedule & Distributed Lock (Width 740) -->
  <g transform="translate(440, 165)">
    <!-- Schedule Box -->
    <rect x="0" y="0" width="740" height="240" rx="12" fill="#111827" stroke="rgba(255,255,255,0.1)"/>
    <text x="25" y="32" fill="#fff" font-size="13" font-weight="bold">Upcoming Execution Schedule</text>
    
    <!-- Timezone Dropdown Mockup -->
    <rect x="520" y="15" width="195" height="28" rx="6" fill="rgba(0,0,0,0.4)" stroke="rgba(255,255,255,0.15)"/>
    <text x="535" y="34" fill="#a5b4fc" font-size="11">Asia/Dubai (GST +04:00)</text>

    <!-- Execution Rows -->
    <g transform="translate(25, 60)" font-family="'JetBrains Mono', monospace" font-size="11">
      <text y="0" fill="#38bdf8">#01</text>
      <text x="40" y="0" fill="#f3f4f6">Sep 30, 09:00:00 (GST)</text>
      <text x="320" y="0" fill="#9ca3af">Interval: +15m 00s</text>
      <text x="530" y="0" fill="#10b981">Starts in 11h 41m</text>

      <text y="30" fill="#38bdf8">#02</text>
      <text x="40" y="30" fill="#f3f4f6">Sep 30, 09:15:00 (GST)</text>
      <text x="320" y="30" fill="#9ca3af">Interval: +15m 00s</text>
      <text x="530" y="30" fill="#10b981">Starts in 11h 56m</text>

      <text y="60" fill="#38bdf8">#03</text>
      <text x="40" y="60" fill="#f3f4f6">Sep 30, 09:30:00 (GST)</text>
      <text x="320" y="60" fill="#9ca3af">Interval: +15m 00s</text>
      <text x="530" y="60" fill="#10b981">Starts in 12h 11m</text>

      <text y="90" fill="#38bdf8">#04</text>
      <text x="40" y="90" fill="#f3f4f6">Sep 30, 09:45:00 (GST)</text>
      <text x="320" y="90" fill="#9ca3af">Interval: +15m 00s</text>
      <text x="530" y="90" fill="#10b981">Starts in 12h 26m</text>

      <text y="120" fill="#38bdf8">#05</text>
      <text x="40" y="120" fill="#f3f4f6">Sep 30, 10:00:00 (GST)</text>
      <text x="320" y="120" fill="#9ca3af">Interval: +15m 00s</text>
      <text x="530" y="120" fill="#10b981">Starts in 12h 41m</text>
    </g>

    <!-- Distributed Lock Synthesizer Box -->
    <rect x="0" y="255" width="740" height="250" rx="12" fill="#111827" stroke="rgba(255,255,255,0.1)"/>
    <text x="25" y="285" fill="#fff" font-size="13" font-weight="bold">Distributed Lock Middleware (Atomic Redis SET NX EX)</text>
    
    <rect x="25" y="300" width="690" height="185" rx="8" fill="#0d1117" stroke="rgba(255,255,255,0.05)"/>
    <g transform="translate(40, 325)" font-family="'JetBrains Mono', monospace" font-size="11">
      <text y="0" fill="#6a737d">// Acquire distributed mutex atomically across replicas</text>
      <text y="22" fill="#ff7b72">const</text>
      <text x="45" y="22" fill="#79c0ff">acquired = await redis.set(LOCK_KEY, lockToken, </text>
      <text x="405" y="22" fill="#a5d6ff">'NX'</text>
      <text x="435" y="22" fill="#79c0ff">, </text>
      <text x="450" y="22" fill="#a5d6ff">'EX'</text>
      <text x="480" y="22" fill="#79c0ff">, 300);</text>

      <text y="50" fill="#ff7b72">if</text>
      <text x="20" y="50" fill="#79c0ff">(!acquired) {</text>
      <text y="72" fill="#ff7b72">  return</text>
      <text x="60" y="72" fill="#79c0ff">console.log('Skipping: task already running on another pod.');</text>
      <text y="94" fill="#79c0ff">}</text>

      <text y="125" fill="#ff7b72">try</text>
      <text x="25" y="125" fill="#79c0ff">{ await executeBillingBatch(); }</text>
      <text y="147" fill="#ff7b72">finally</text>
      <text x="50" y="147" fill="#79c0ff">{ await redis.eval(RELEASE_LUA, 1, LOCK_KEY, lockToken); }</text>
    </g>
  </g>
</svg>
